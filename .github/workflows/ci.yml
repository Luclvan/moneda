name: Flutter CI

on:
  push:
    branches: [ "main", "dev", "ui/**", "feat/**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test_and_analyze:
    name: Analyze and Test Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

