<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Moneda - Quản lý tài chính cá nhân theo quy tắc 3 hũ">
  <meta name="theme-color" content="#1E40AF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moneda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moneda</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #1E40AF;
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-x pan-y;
    }
  </style>
</head>
<body>
  <script>
    // Chặn iOS Safari/PWA edge-swipe back/forward gesture làm reload stack
    window.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        var touchX = e.touches[0].clientX;
        if (touchX <= 28 || touchX >= window.innerWidth - 28) {
          e.preventDefault();
        }
      }
    }, { passive: false });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
